[project]
name = "hrtf-score-prior"
version = "0.1.0"
description = "HRTF estimation using a score-based prior (arXiv:2410.01562), Table I experiment"
requires-python = ">=3.9,<3.10"
dependencies = [
    "torch==2.6.0",
    "torchaudio==2.6.0",
    "hydra-core==1.3.2",
    "omegaconf==2.3.0",
    "numpy==1.26.4",
    "librosa==0.10.1",
    "soundfile==0.12.1",
    "einops==0.8.2",
    "torchcde==0.2.5",
    "tqdm==4.66.2",
    "pandas==2.2.1",
    "matplotlib==3.8.3",
    "sofar==1.3.0",
    "scipy==1.11.4",
    "soxr==0.3.7",
    "numba==0.59.1",
    "setuptools<81",  # librosa 0.10.1 imports pkg_resources
]

[tool.uv]
package = false

[tool.uv.sources]
torch = { index = "pytorch-cu124" }
torchaudio = { index = "pytorch-cu124" }

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true
